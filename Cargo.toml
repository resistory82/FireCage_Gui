[package]
name = "firecage_gui"
version = "0.0.1"
edition = "2021"

[dependencies]
# Fenster + Oberfläche
eframe = "0.29"
# Bild-Lader (für das SVG-Logo)
egui_extras = { version = "0.29", features = ["svg"] }
# SQLite – "bundled" kompiliert SQLite mit ein, keine Installation nötig
rusqlite = { version = "0.32", features = ["bundled"] }
# Zeit/Datum
chrono = "0.4"
# UUIDs für Datensätze
uuid = { version = "1", features = ["v4"] }
